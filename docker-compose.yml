services:
  postgres:
    image: postgres:16-alpine
    container_name: payout-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: payout
      POSTGRES_DB: payout_dev
    ports:
      - "5432:5432"
    volumes:
      - payout_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: payout-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  payout_pg_data:
