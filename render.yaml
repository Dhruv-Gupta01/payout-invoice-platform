# Render Blueprint for the BACKEND (Express API + BullMQ worker in one service).
# Postgres is on Neon, Redis is on Upstash — set their URLs (and the secrets
# below) in the Render dashboard; `sync: false` means Render will not overwrite
# a value you enter there.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: payout-invoice-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    # migrate deploy is idempotent; running it at startup avoids needing
    # Render's paid-tier preDeployCommand.
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: REDIS_URL             # Upstash rediss:// URL
        sync: false
      - key: SESSION_SECRET        # generate: openssl rand -hex 32
        sync: false
      - key: FRONTEND_BASE_URL     # the Vercel URL, e.g. https://payout-invoice.vercel.app
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_KYC_FOLDER_ID
        sync: false
      - key: GOOGLE_INVOICE_TEMPLATE_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
